name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oxybook
          POSTGRES_PASSWORD: oxybook-ci
          POSTGRES_DB: oxybook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxybook -d oxybook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      # packages/db runs its migration test against this database. Without it the suite skips.
      DATABASE_URL: postgres://oxybook:oxybook-ci@127.0.0.1:5432/oxybook
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm test:corpus
